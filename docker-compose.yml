services:
  db:
    image: postgres:16-alpine
    container_name: devtracker-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=devtracker
      - POSTGRES_USER=devtracker
      - POSTGRES_PASSWORD=devtracker
    ports:
      - "5432:5432"
    volumes:
      - ./devtracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtracker -d devtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devtracker-pgdata:
