services:
  - type: web
    name: devtracker-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devtracker-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 30
      - key: CORS_ORIGIN
        value: https://devtracker.onrender.com

databases:
  - name: devtracker-db
    plan: free
    databaseName: devtracker
    ipAllowList: []
